name: Go

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.18', '1.17']
        os: ['ubuntu-latest']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}

    - name: Build containers
      run: docker compose build

    - name: Start PostgreSQL
      run: docker compose up -d postgres

    # Aguarda até o Postgres estar pronto
    - name: Wait for PostgreSQL
      run: |
        echo "Aguardando PostgreSQL aceitar conexões..."
        until docker compose exec -T postgres pg_isready -U root; do
          sleep 2
        done

    - name: Run tests
      env:
        DB_HOST: 127.0.0.1   # conexão externa ao container, usa a porta publicada
        DB_USER: root
        DB_PASS: root
        DB_NAME: root
        DB_PORT: 5432
      run: |
        go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: docker compose build









