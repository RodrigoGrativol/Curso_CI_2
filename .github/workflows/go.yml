name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.18', '1.17']
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}

    - name: Build containers
      run: docker compose build

    - name: Start services
      run: docker compose up -d

    # Aguarda o PostgreSQL ficar pronto
    - name: Wait for DB
      run: |
        echo "Aguardando PostgreSQL..."
        until docker compose exec -T db pg_isready -U root; do
            sleep 2
        done

    # Executa os testes dentro do container App (caso você tenha um)
    # Se não tiver container de App, executamos apenas no host,
    # mas conectado à rede interna do compose.
    - name: Run tests
      env:
        DB_HOST: db          # hostname do postgres no docker compose
        DB_USER: root
        DB_PASS: root
        DB_NAME: root
      run: |
        go test -v ./...

  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
    
    - name: Build
      run: docker compose build








